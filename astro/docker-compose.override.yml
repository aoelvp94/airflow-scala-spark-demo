# Host networking: bridge traffic between containers is blocked on this box, so every service
# shares the host network on non-default ports.
services:
  postgres:
    network_mode: host
    networks: !reset null
    ports: !reset []
    command: ["postgres", "-p", "56432", "-c", "listen_addresses=127.0.0.1"]
