    network_mode: host
    networks: !reset null
    environment:
      AIRFLOW__SDK__COORDINATORS: "{\"scala-jdk\":{\"classpath\":\"airflow.sdk.coordinators.java.JavaCoordinator\",\"kwargs\":{\"task_handler_bundle_name\":\"scala-spark\",\"main_class\":\"example.scalaspark.BundleMain\",\"jvm_args\":[\"-Xmx1g\",\"-XX:+IgnoreUnrecognizedVMOptions\",\"--add-modules=jdk.incubator.vector\",\"--add-opens=java.base/java.lang=ALL-UNNAMED\",\"--add-opens=java.base/java.lang.invoke=ALL-UNNAMED\",\"--add-opens=java.base/java.lang.reflect=ALL-UNNAMED\",\"--add-opens=java.base/java.io=ALL-UNNAMED\",\"--add-opens=java.base/java.net=ALL-UNNAMED\",\"--add-opens=java.base/java.nio=ALL-UNNAMED\",\"--add-opens=java.base/java.util=ALL-UNNAMED\",\"--add-opens=java.base/java.util.concurrent=ALL-UNNAMED\",\"--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED\",\"--add-opens=java.base/jdk.internal.ref=ALL-UNNAMED\",\"--add-opens=java.base/sun.nio.ch=ALL-UNNAMED\",\"--add-opens=java.base/sun.nio.cs=ALL-UNNAMED\",\"--add-opens=java.base/sun.security.action=ALL-UNNAMED\",\"--add-opens=java.base/sun.util.calendar=ALL-UNNAMED\",\"--add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED\",\"-Djdk.reflect.useDirectMethodHandle=false\",\"-Dio.netty.tryReflectionSetAccessible=true\"],\"task_startup_timeout\":60.0}}}"
      AIRFLOW__SDK__QUEUE_TO_COORDINATOR: "{\"scala\":\"scala-jdk\"}"
      AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: "[{\"name\":\"dags-folder\",\"classpath\":\"airflow.dag_processing.bundles.local.LocalDagBundle\",\"kwargs\":{}},{\"name\":\"scala-spark\",\"classpath\":\"airflow.dag_processing.bundles.local.LocalDagBundle\",\"kwargs\":{\"path\":\"/usr/local/airflow/include/scala-bundle\",\"refresh_interval\":0}}]"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_CONN_SPARK_LOCAL: "{\"conn_type\":\"spark\",\"host\":\"local[*]\"}"
      BENCH_ROWS: "20000000"
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: "postgresql://postgres:postgres@127.0.0.1:56432"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql://postgres:postgres@127.0.0.1:56432"
